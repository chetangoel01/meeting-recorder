name: MeetingRecorder
options:
  bundleIdPrefix: com.chetangoel
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: P48VDW72LU
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
targets:
  MeetingRecorder:
    type: application
    platform: macOS
    sources:
      - path: MeetingRecorder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chetangoel.MeetingRecorder
        PRODUCT_NAME: MeetingRecorder
        INFOPLIST_FILE: MeetingRecorder/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MeetingRecorder/Resources/MeetingRecorder.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - MeetingRecorderTests
  MeetingRecorderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MeetingRecorderTests
    dependencies:
      - target: MeetingRecorder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chetangoel.MeetingRecorderTests
        GENERATE_INFOPLIST_FILE: YES
